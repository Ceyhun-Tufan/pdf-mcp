[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-mcp"
version = "1.2.0"
description = "A Model Context Protocol (MCP) Server and CLI Toolkit for reading, searching, comparing, and generating publication-grade styled PDF documents."
readme = "README.md"
authors = [{ name = "Ceyhun" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pypdf>=4.0.0",
    "fpdf2>=2.8.0",
    "matplotlib>=3.5.0",
]
keywords = ["pdf", "mcp", "model-context-protocol", "ai-agent", "pdf-generator", "report-builder"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]

[project.scripts]
pdf-mcp = "pdf_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf_mcp*"]
